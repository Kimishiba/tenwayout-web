<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="320" height="320">
  <!-- 5-Spoke Wheel Mark Container (Centered at x=160, y=160) -->
  <g transform="translate(160, 160)">
    <!-- White Wheel Dial Base -->
    <circle r="102" fill="#FFFFFF" stroke="#000000" stroke-width="5" />
    <circle r="88" fill="none" stroke="#000000" stroke-width="2.5" stroke-dasharray="3 9" />

    <!-- EXACT 5-SPOKE SYMMETRY -->
    
    <!-- Spoke 1: Breakout Spoke + Upward 45° Orange Lightning Arrow -->
    <g transform="rotate(45)">
      <path d="M -10 -20 L -6 -45 L 6 -45 L 10 -20 Z" fill="#000000" />
      <polygon points="0,-146 19,-106 5,-104 20,-68 0,-25 -15,-58 -3,-70 -19,-98" fill="#FF5500" stroke="#000000" stroke-width="3.5" stroke-linejoin="round" />
    </g>

    <!-- Spoke 2: 45° + 72° = 117° -->
    <g transform="rotate(117)">
      <path d="M -10 -20 L -6 -82 L 6 -82 L 10 -20 Z" fill="#000000" />
    </g>

    <!-- Spoke 3: 117° + 72° = 189° -->
    <g transform="rotate(189)">
      <path d="M -10 -20 L -6 -82 L 6 -82 L 10 -20 Z" fill="#000000" />
    </g>

    <!-- Spoke 4: 189° + 72° = 261° -->
    <g transform="rotate(261)">
      <path d="M -10 -20 L -6 -82 L 6 -82 L 10 -20 Z" fill="#000000" />
    </g>

    <!-- Spoke 5: 261° + 72° = 333° -->
    <g transform="rotate(333)">
      <path d="M -10 -20 L -6 -82 L 6 -82 L 10 -20 Z" fill="#000000" />
    </g>

    <!-- Center Axle Hub -->
    <circle r="24" fill="#FF5500" stroke="#000000" stroke-width="4" />
    <circle r="10" fill="#FFFFFF" stroke="#000000" stroke-width="3" />
  </g>
</svg>
