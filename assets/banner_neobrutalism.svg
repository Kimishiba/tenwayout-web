<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="1200" height="480">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Archivo+Black&amp;family=Barlow+Semi+Condensed:wght@700;800;900&amp;family=Space+Grotesk:wght@700&amp;family=Space+Mono:wght@700&amp;display=swap');
      .title { font-family: 'Archivo Black', Impact, -apple-system, sans-serif; font-weight: 900; }
      .sans { font-family: 'Space Grotesk', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 700; }
      .mono { font-family: 'Space Mono', 'Courier New', monospace; font-weight: 700; }
      .badge { font-family: 'Barlow Semi Condensed', Impact, -apple-system, sans-serif; font-weight: 900; letter-spacing: 1.2px; }
    </style>
    <!-- Crisp Geometric Dot Grid -->
    <pattern id="dotGrid_900" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="1.5" fill="#E5E7EB" />
    </pattern>
  </defs>

  <!-- Canvas Background: Pure White with Subtle Dot Matrix -->
  <rect width="1200" height="480" fill="#FFFFFF" />
  <rect width="1200" height="480" fill="url(#dotGrid_900)" />
  
  <!-- Outer Frame (Heavy Neo-Brutalist 4px Border) -->
  <rect x="16" y="16" width="1168" height="448" rx="16" fill="none" stroke="#000000" stroke-width="4" />

  <!-- ================= LEFT MAIN CARD ================= -->
  <!-- Hard 8px Drop Shadow -->
  <rect x="56" y="56" width="660" height="368" rx="16" fill="#000000" />
  <!-- Card Surface -->
  <rect x="48" y="48" width="660" height="368" rx="16" fill="#FFFFFF" stroke="#000000" stroke-width="4.5" />

  <!-- Top Pill Badges -->
  <g transform="translate(76, 74)">
    <!-- Green Status Badge -->
    <rect x="0" y="0" width="175" height="32" rx="6" fill="#065F46" stroke="#000000" stroke-width="3" />
    <text x="87.5" y="21" text-anchor="middle" fill="#FFFFFF" class="badge" font-size="13">⚡ SPEED UNLOCKED</text>

    <!-- Orange Protocol Badge -->
    <rect x="187" y="0" width="160" height="32" rx="6" fill="#FF5500" stroke="#000000" stroke-width="3" />
    <text x="267" y="21" text-anchor="middle" fill="#FFFFFF" class="badge" font-size="13">UART / CAN-BUS</text>

    <!-- Yellow Bluetooth Chip -->
    <rect x="359" y="0" width="165" height="32" rx="6" fill="#FFDD00" stroke="#000000" stroke-width="3" />
    <text x="441.5" y="21" text-anchor="middle" fill="#000000" class="badge" font-size="13">BLUETOOTH BLE</text>
  </g>

  <!-- Big Bold Title in Archivo Black -->
  <text x="76" y="182" fill="#000000" class="title" font-size="68" letter-spacing="-1.5px">
    TENWAY<tspan fill="#FF5500">OUT</tspan>
  </text>
  <line x1="76" y1="204" x2="640" y2="204" stroke="#000000" stroke-width="4.5" />

  <!-- Subtitle & Specs -->
  <text x="76" y="238" fill="#000000" class="sans" font-size="21">Universal UART &amp; CAN-Bus Speed Bridge</text>
  <text x="76" y="268" fill="#374151" class="mono" font-size="14">Raise assisted cutoff: 25 km/h → 33 km/h</text>
  <text x="76" y="292" fill="#6B7280" class="mono" font-size="13">Custom Module + Bluetooth • Non-destructive Inline Proxy</text>

  <!-- Bottom Hardware Chips -->
  <g transform="translate(76, 332)">
    <rect x="0" y="0" width="140" height="40" rx="8" fill="#F3F4F6" stroke="#000000" stroke-width="3" />
    <text x="70" y="25" text-anchor="middle" fill="#000000" class="badge" font-size="13.5">CUSTOM PCB</text>

    <rect x="152" y="0" width="130" height="40" rx="8" fill="#F3F4F6" stroke="#000000" stroke-width="3" />
    <text x="217" y="25" text-anchor="middle" fill="#000000" class="badge" font-size="13.5">BLUETOOTH</text>

    <rect x="294" y="0" width="130" height="40" rx="8" fill="#065F46" stroke="#000000" stroke-width="3" />
    <text x="359" y="25" text-anchor="middle" fill="#FFFFFF" class="badge" font-size="13.5">PLUG &amp; PLAY</text>

    <rect x="436" y="0" width="130" height="40" rx="8" fill="#FF5500" stroke="#000000" stroke-width="3" />
    <text x="501" y="25" text-anchor="middle" fill="#FFFFFF" class="badge" font-size="13.5">ZERO-FLASH</text>
  </g>

  <!-- ================= RIGHT LOGO EMBLEM CARD ================= -->
  <g transform="translate(748, 48)">
    <!-- Card Shadow -->
    <rect x="8" y="8" width="396" height="368" rx="16" fill="#000000" />
    <!-- Pine Green Card Face -->
    <rect x="0" y="0" width="396" height="368" rx="16" fill="#065F46" stroke="#000000" stroke-width="4.5" />

    <!-- Top Badge Row -->
    <rect x="24" y="22" width="155" height="28" rx="6" fill="#000000" stroke="#000000" stroke-width="2" />
    <text x="101.5" y="40" text-anchor="middle" fill="#FFFFFF" class="badge" font-size="12">INLINE // MITM</text>

    <rect x="190" y="22" width="182" height="28" rx="6" fill="#FFFFFF" stroke="#000000" stroke-width="2.5" />
    <text x="281" y="40" text-anchor="middle" fill="#000000" class="badge" font-size="12">UART + CAN-BUS</text>

    <!-- 5-Spoke Wheel Mark Container (Centered at x=198, y=188) -->
    <g transform="translate(198, 188)">
      <!-- White Wheel Dial Base -->
      <circle r="102" fill="#FFFFFF" stroke="#000000" stroke-width="4.5" />
      <circle r="88" fill="none" stroke="#000000" stroke-width="2.5" stroke-dasharray="3 9" />

      <!-- EXACT 5-SPOKE SYMMETRY -->
      
      <!-- Spoke 1: Breakout Spoke + Upward 45° Orange Lightning Arrow -->
      <g transform="rotate(45)">
        <path d="M -10 -20 L -6 -45 L 6 -45 L 10 -20 Z" fill="#000000" />
        <polygon points="0,-146 19,-106 5,-104 20,-68 0,-25 -15,-58 -3,-70 -19,-98" fill="#FF5500" stroke="#000000" stroke-width="3.5" stroke-linejoin="round" />
      </g>

      <!-- Spoke 2: 45° + 72° = 117° -->
      <g transform="rotate(117)">
        <path d="M -10 -20 L -6 -82 L 6 -82 L 10 -20 Z" fill="#000000" />
      </g>

      <!-- Spoke 3: 117° + 72° = 189° -->
      <g transform="rotate(189)">
        <path d="M -10 -20 L -6 -82 L 6 -82 L 10 -20 Z" fill="#000000" />
      </g>

      <!-- Spoke 4: 189° + 72° = 261° -->
      <g transform="rotate(261)">
        <path d="M -10 -20 L -6 -82 L 6 -82 L 10 -20 Z" fill="#000000" />
      </g>

      <!-- Spoke 5: 261° + 72° = 333° -->
      <g transform="rotate(333)">
        <path d="M -10 -20 L -6 -82 L 6 -82 L 10 -20 Z" fill="#000000" />
      </g>

      <!-- Center Axle Hub -->
      <circle r="24" fill="#FF5500" stroke="#000000" stroke-width="3.5" />
      <circle r="10" fill="#FFFFFF" stroke="#000000" stroke-width="2.5" />
    </g>

    <!-- Bottom Stat Ribbon -->
    <rect x="24" y="316" width="348" height="32" rx="6" fill="#FFDD00" stroke="#000000" stroke-width="2.5" />
    <text x="198" y="337" text-anchor="middle" fill="#000000" class="badge" font-size="13.5" letter-spacing="1px">LIMIT: 25 KM/H → 33 KM/H</text>
  </g>
</svg>